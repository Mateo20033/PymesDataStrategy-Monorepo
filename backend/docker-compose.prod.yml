services:
  # ==========================================================================
  # CADDY — Reverse Proxy + Auto-HTTPS
  # ==========================================================================
  caddy:
    image: caddy:2-alpine
    container_name: pymes-caddy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
    restart: always

  # ==========================================================================
  # REDIS
  # ==========================================================================
  redis:
    image: redis:7.4-alpine
    container_name: pymes-redis
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  # ==========================================================================
  # POSTGRESQL — ETL
  # ==========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: pymes-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  # ==========================================================================
  # POSTGRESQL — Analytics Dashboard
  # ==========================================================================
  pymes-dashboard-db:
    image: postgres:16-alpine
    container_name: pymes-dashboard-db
    environment:
      POSTGRES_USER: ${PYMES_DASHBOARD_DB_USER}
      POSTGRES_PASSWORD: ${PYMES_DASHBOARD_DB_PASSWORD}
      POSTGRES_DB: ${PYMES_DASHBOARD_DB_NAME}
    volumes:
      - pymes_dashboard_postgres_data:/var/lib/postgresql/data
      - ../services/dashboard-pymes/backend/src/models/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PYMES_DASHBOARD_DB_USER} -d ${PYMES_DASHBOARD_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  # ==========================================================================
  # MINIO — Object Storage
  # ==========================================================================
  minio:
    image: minio/minio:RELEASE.2024-02-17T01-15-57Z
    container_name: pymes-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: always

  minio-init:
    image: minio/mc:latest
    container_name: pymes-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
      mc mb --ignore-existing myminio/datasets;
      mc mb --ignore-existing myminio/results;
      mc mb --ignore-existing myminio/temp;
      mc anonymous set download myminio/results;
      echo 'Buckets ready';
      exit 0;
      "
    restart: "no"

  # ==========================================================================
  # API GATEWAY — Node.js + Express + Prisma
  # ==========================================================================
  api:
    build:
      context: .
      dockerfile: api/Dockerfile.prod
    container_name: pymes-api
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_USE_SSL: "false"
      MINIO_BUCKET_DATASETS: datasets
      MINIO_BUCKET_RESULTS: results
      MINIO_BUCKET_TEMP: temp
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT}
      LOG_LEVEL: warn
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
      N8N_SUGGESTIONS_WEBHOOK_URL: ${N8N_SUGGESTIONS_WEBHOOK_URL:-}
      N8N_WEBHOOK_SECRET: ${N8N_WEBHOOK_SECRET}
      BACKEND_PUBLIC_URL: ${BACKEND_PUBLIC_URL}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      INSTRUCTION_PARSER_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: always

  # ==========================================================================
  # DASHBOARD BACKEND — Node.js + Express
  # ==========================================================================
  pymes-dashboard-backend:
    build:
      context: ../services/dashboard-pymes/backend
      dockerfile: Dockerfile
    container_name: pymes-dashboard-backend
    environment:
      PORT: 3001
      NODE_ENV: production
      DB_HOST: pymes-dashboard-db
      DB_PORT: 5432
      DB_NAME: ${PYMES_DASHBOARD_DB_NAME}
      DB_USER: ${PYMES_DASHBOARD_DB_USER}
      DB_PASSWORD: ${PYMES_DASHBOARD_DB_PASSWORD}
      JWT_SECRET: ${PYMES_DASHBOARD_JWT_SECRET}
      JWT_EXPIRES_IN: ${PYMES_DASHBOARD_JWT_EXPIRES_IN:-7d}
      AGENT_URL: http://pymes-dashboard-agent:8000
    depends_on:
      pymes-dashboard-db:
        condition: service_healthy
    restart: always

  # ==========================================================================
  # DASHBOARD AGENT — Python + FastAPI + Gemini
  # ==========================================================================
  pymes-dashboard-agent:
    build:
      context: ../services/dashboard-pymes/agent
      dockerfile: Dockerfile
    container_name: pymes-dashboard-agent
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      DB_HOST: pymes-dashboard-db
      DB_PORT: 5432
      DB_NAME: ${PYMES_DASHBOARD_DB_NAME}
      DB_USER: ${PYMES_DASHBOARD_DB_USER}
      DB_PASSWORD: ${PYMES_DASHBOARD_DB_PASSWORD}
      BACKEND_URL: http://pymes-dashboard-backend:3001
    depends_on:
      pymes-dashboard-db:
        condition: service_healthy
      pymes-dashboard-backend:
        condition: service_started
    restart: always

  # ==========================================================================
  # WORKER ETL — Python + FastAPI + Polars
  # ==========================================================================
  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile.prod
    container_name: pymes-worker
    environment:
      ENVIRONMENT: production
      PORT: 8000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_USE_SSL: "false"
      MINIO_BUCKET_DATASETS: datasets
      MINIO_BUCKET_RESULTS: results
      MINIO_BUCKET_TEMP: temp
      LOG_LEVEL: warn
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
      N8N_SUGGESTIONS_WEBHOOK_URL: ${N8N_SUGGESTIONS_WEBHOOK_URL:-}
      N8N_WEBHOOK_SECRET: ${N8N_WEBHOOK_SECRET}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
    depends_on:
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: always

  # ==========================================================================
  # FRONTEND — Next.js (producción, sin volúmenes de código fuente)
  # ==========================================================================
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile.prod
      args:
        NEXTAUTH_URL: ${NEXTAUTH_URL}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
    container_name: pymes-frontend
    environment:
      NODE_ENV: production
      PORT: 3001
      INTERNAL_API_URL: http://api:3000
      DASHBOARD_API_URL: http://pymes-dashboard-backend:3001
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3001"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: always

volumes:
  redis_data:
  postgres_data:
  minio_data:
  pymes_dashboard_postgres_data:
  caddy_data:
  caddy_config:

networks:
  default:
    name: pymes-network-prod
